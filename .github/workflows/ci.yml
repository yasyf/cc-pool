name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  suite-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject Go and Swift dependency skew
        run: |
          .github/scripts/verify-suite-pins_test.sh
          .github/scripts/verify-suite-pins.sh

  test:
    needs: suite-pins
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Validate release workflow
        run: bash .github/scripts/verify-release-workflow.sh

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formula service ownership
        run: .github/scripts/assert-formula-service.sh

      - name: Test Homebrew package bootstrap
        run: scripts/install_test.sh

      - name: go vet
        run: go vet ./...

      - name: Verify generated control wire identity
        run: go run ./internal/daemon/wirebuildgen -check

      - name: Test
        run: ./scripts/test.sh -race -count=1 ./...

      - name: Build (default, pure Go)
        run: go build ./...

      - name: Build amd64 (cross, pure Go)
        run: CGO_ENABLED=0 GOARCH=amd64 go build -o /tmp/ccp-amd64 ./cmd/cc-pool

      - name: Build signed runtime archive
        run: CGO_ENABLED=1 go build -buildmode=c-archive -o /tmp/libCCPoolFuseKit.a ./cmd/cc-pool-runtime-archive

  widget-test:
    needs: suite-pins
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - uses: yasyf/homebrew-tap/.github/actions/prepare-app-build@fb4f471718f99cbfd627192e8c3f76c620e24be4
        with:
          go-version: 1.26.5
          go-cache-dependency-path: go.sum
          brew-packages: |
            xcodegen

      - name: Test widget and build File Provider app
        run: |
          cd widget
          printf 'MARKETING_VERSION = 0.0.0\nCURRENT_PROJECT_VERSION = 1\n' > Version.xcconfig
          xcodegen generate
          xcodebuild -project CCPoolStatus.xcodeproj -scheme CCPoolStatus \
            -configuration Debug -derivedDataPath build build test \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-"

  smoke:
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build + version smoke
        run: |
          go build -ldflags "-X github.com/yasyf/cc-pool/internal/version.Version=ci" -o /tmp/cc-pool ./cmd/cc-pool
          /tmp/cc-pool --version | grep -q ci
          /tmp/cc-pool --help | grep -q "emptiest account"
          /tmp/cc-pool list || true   # exits cleanly with "no accounts" before init

  # lint and vuln only ANALYZE source, so they run on cheap ubuntu runners —
  # but cc-pool is darwin-only (procscan's unix.SysctlKinfoProcSlice etc. don't
  # exist on linux), so both must typecheck as GOOS=darwin or they fail on
  # undefined darwin-only symbols.
  lint:
    runs-on: ubuntu-latest
    env:
      GOOS: darwin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # GOOS scopes to the analysis only: set on the whole job it would make
      # `go install` cross-compile govulncheck itself into a darwin_* subdir
      # the runner can't exec (exit 127).
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          GOOS=darwin govulncheck ./...
