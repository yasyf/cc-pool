name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Test
        run: ./scripts/test.sh -race -count=1 ./...

      - name: Build (default, pure Go)
        run: go build ./...

      - name: Build amd64 (cross, pure Go)
        run: CGO_ENABLED=0 GOARCH=amd64 go build -o /tmp/ccp-amd64 ./cmd/cc-pool

      - name: Vet + compile fuse variant (cgo + fuse-t headers)
        # fuse-t is not present on CI runners; install headers/lib so the cgo
        # fuse build compiles. The live mount test is skipped (needs the
        # interactive "Network Volumes" grant) — compilation is the canary.
        run: |
          brew install macos-fuse-t/cask/fuse-t || echo "fuse-t tap unavailable; skipping fuse build"
          if [ -f /usr/local/lib/libfuse-t.dylib ]; then
            CGO_ENABLED=1 go vet -tags fuse ./...
            CGO_ENABLED=1 go build -tags fuse ./...
            # Method-level mirror/merged-view tests need no mount; the live
            # mount test self-skips (needs the interactive grant).
            CGO_ENABLED=1 ./scripts/test.sh -tags fuse -count=1 -run "Mirror|ClaudeJSON" ./internal/overlay/
          else
            echo "::warning::fuse-t unavailable — fuse merged-view tests skipped"
          fi

  smoke:
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Build + version smoke
        run: |
          go build -ldflags "-X github.com/yasyf/fusekit/version.Version=ci" -o /tmp/cc-pool ./cmd/cc-pool
          /tmp/cc-pool --version | grep -q ci
          /tmp/cc-pool --help | grep -q "emptiest account"
          /tmp/cc-pool list || true   # exits cleanly with "no accounts" before init

  # lint and vuln only ANALYZE source, so they run on cheap ubuntu runners —
  # but cc-pool is darwin-only (procscan's unix.SysctlKinfoProcSlice etc. don't
  # exist on linux), so both must typecheck as GOOS=darwin or they fail on
  # undefined darwin-only symbols.
  lint:
    runs-on: ubuntu-latest
    env:
      GOOS: darwin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # GOOS scopes to the analysis only: set on the whole job it would make
      # `go install` cross-compile govulncheck itself into a darwin_* subdir
      # the runner can't exec (exit 127).
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          GOOS=darwin govulncheck ./...
