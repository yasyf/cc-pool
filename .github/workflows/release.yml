name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-on-main:
    # Only commits that live on main may be released. A vX.Y.Z tag is built and
    # published from its own commit, so if that commit isn't reachable from main
    # (e.g. a `git push` of main lost a race and the tag went out anyway, or the
    # tag was cut from a side branch) the release would not reflect main's
    # history. Fail fast — before any macOS runner spins up — and make the rest
    # of the pipeline depend on this.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so merge-base can reach the common ancestor
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main — only commits on main can be released. Push the commit to main first, then re-tag."
            exit 1
          fi
          echo "ok: ${GITHUB_SHA} is contained in main"

  build:
    runs-on: macos-15
    needs: verify-on-main
    outputs:
      pure_sha256: ${{ steps.shas.outputs.pure }}
      fuse_sha256: ${{ steps.shas.outputs.fuse }}
      app_sha256: ${{ steps.shas.outputs.app }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history — the widget's CURRENT_PROJECT_VERSION is the commit count

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Install fuse-t (build-time headers for the -tags fuse variant)
        run: brew install macos-fuse-t/cask/fuse-t

      - name: Import Developer ID certificate
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KP="$(openssl rand -base64 24)"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          echo -n "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_SIGN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/[\" ]//g')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "MACOS_SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')" >> "$GITHUB_ENV"
          echo -n "$MACOS_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "MACOS_NOTARY_KEY_FILE=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_KEY_ID=$MACOS_NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_ISSUER=$MACOS_NOTARY_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Build universal binaries (pure Go + fuse, arm64 + amd64 via lipo)
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          LDFLAGS="-s -w -X github.com/yasyf/cc-pool/internal/version.Version=${VERSION} -X github.com/yasyf/cc-pool/internal/version.Commit=${COMMIT}"
          mkdir -p dist/pure dist/fuse dist/arm64

          # Pure Go (symlink overlay; the default install).
          CGO_ENABLED=0 GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/pure-arm64 ./cmd/cc-pool
          CGO_ENABLED=0 GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/pure-amd64 ./cmd/cc-pool
          lipo -create -output dist/pure/cc-pool dist/pure-arm64 dist/pure-amd64

          # Fuse variant (live-mirror overlay): cgo, dlopens libfuse-t at
          # runtime. The amd64 slice cross-compiles — the macOS SDK is fat.
          export CGO_CFLAGS="-mmacosx-version-min=12.0" CGO_LDFLAGS="-mmacosx-version-min=12.0"
          CGO_ENABLED=1 GOARCH=arm64 go build -tags fuse -ldflags "$LDFLAGS" -o dist/fuse-arm64 ./cmd/cc-pool
          CGO_ENABLED=1 GOARCH=amd64 CC="clang -arch x86_64" go build -tags fuse -ldflags "$LDFLAGS" -o dist/fuse-amd64 ./cmd/cc-pool
          lipo -create -output dist/fuse/cc-pool dist/fuse-arm64 dist/fuse-amd64

          # Developer ID sign (hardened runtime) post-lipo, then smoke-test the native
          # slices. macOS 15/26 SIGKILL ad-hoc/Team-less signatures, so the old
          # `codesign -s -` is replaced. The fuse build dlopens libfuse-t (another team's
          # dylib) so it needs disable-library-validation; the pure build doesn't.
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>com.apple.security.cs.disable-library-validation</key><true/></dict></plist>' > "$RUNNER_TEMP/fuse-ents.plist"
          codesign --force --options runtime --timestamp -s "$MACOS_SIGN_IDENTITY" dist/pure/cc-pool
          codesign --force --options runtime --timestamp --entitlements "$RUNNER_TEMP/fuse-ents.plist" -s "$MACOS_SIGN_IDENTITY" dist/fuse/cc-pool
          codesign --verify --strict dist/pure/cc-pool dist/fuse/cc-pool
          dist/pure/cc-pool --version | grep -q "${VERSION}"
          dist/fuse/cc-pool --version | grep -q "${VERSION}"
          # Notarize both universal binaries (bare Mach-O — recorded against cdhash, not stapled).
          for b in dist/pure/cc-pool dist/fuse/cc-pool; do
            z="$(mktemp -d)/cc-pool.zip"; ditto -c -k "$b" "$z"
            xcrun notarytool submit "$z" --key "$MACOS_NOTARY_KEY_FILE" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER" --wait --timeout 20m
          done

          # Every tarball contains a binary named exactly `cc-pool`.
          cp dist/pure-arm64 dist/arm64/cc-pool
          tar -czf "dist/cc-pool-${VERSION}-darwin-universal.tar.gz" -C dist/pure cc-pool
          tar -czf "dist/cc-pool-${VERSION}-darwin-universal-fuse.tar.gz" -C dist/fuse cc-pool
          tar -czf "dist/cc-pool-${VERSION}-darwin-arm64.tar.gz" -C dist/arm64 cc-pool

      - name: Build the Notification Center widget app (cc-pool-status cask payload)
        run: |
          brew install xcodegen
          cd widget
          xcodegen generate
          # The Developer ID team is embedded in the signing identity
          # ("Developer ID Application: … (TEAMID)"); derive it instead of
          # hard-coding so a cert/team rotation can't silently drift.
          TEAM_ID="$(printf '%s' "$MACOS_SIGN_IDENTITY" | sed -n 's/.*(\([A-Z0-9]*\))$/\1/p')"
          test -n "$TEAM_ID"
          # chronod caches widget metadata (supported size families) keyed by
          # bundle version — stamp a real, monotonic version per release or the
          # gallery keeps a stale descriptor and never gains new widget sizes.
          # Developer ID + hardened runtime so a quarantined cask install launches
          # without Gatekeeper blocking it; xcodebuild signs inside-out (appex,
          # then app), applying each target's entitlements from project.yml.
          # CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO: a plain `xcodebuild build`
          # (unlike archive + -exportArchive) injects get-task-allow=YES even in a
          # Release build, which notarization rejects on every executable. Disabling
          # the injection drops it; the appex keeps its sandbox + ~/.cc-pool read
          # exception, which come from its own entitlements file (explicit, not
          # injected).
          xcodebuild -project CCPoolStatus.xcodeproj -scheme CCPoolStatus \
            -configuration Release -derivedDataPath build build \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" \
            CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$MACOS_SIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            ENABLE_HARDENED_RUNTIME=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp"
          APP=build/Build/Products/Release/CCPoolStatus.app
          # The appex must carry the sandbox + ~/.cc-pool read exception, or the
          # widget silently can't read status.json — fail the release instead.
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - "$APP/Contents/PlugIns/CCPoolStatusWidget.appex" 2>&1 |
            grep -q "temporary-exception.files.home-relative-path.read-only"
          # The stamp must actually reach both bundles ($(…) wiring lives in
          # project.yml's info.properties) — a silent 1/1.0 re-ships the
          # stale-gallery bug. The appex is the bundle chronod inspects.
          test "$(plutil -extract CFBundleVersion raw "$APP/Contents/Info.plist")" != 1
          test "$(plutil -extract CFBundleVersion raw "$APP/Contents/PlugIns/CCPoolStatusWidget.appex/Contents/Info.plist")" != 1
          # Notarize the whole bundle, then staple the ticket so a quarantined
          # install validates offline (an app can be stapled; a bare binary can't).
          # notarytool submit --wait exits 0 even when the result is Invalid, so
          # capture the JSON, fail loud on any non-Accepted status, and print the
          # per-issue log — the only place the rejection reason appears.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/CCPoolStatus-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/CCPoolStatus-notarize.zip" \
            --key "$MACOS_NOTARY_KEY_FILE" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER" \
            --wait --timeout 20m --output-format json > "$RUNNER_TEMP/notary-submit.json"
          cat "$RUNNER_TEMP/notary-submit.json"
          SUBMIT_ID="$(plutil -extract id raw -o - "$RUNNER_TEMP/notary-submit.json")"
          if [ "$(plutil -extract status raw -o - "$RUNNER_TEMP/notary-submit.json")" != "Accepted" ]; then
            xcrun notarytool log "$SUBMIT_ID" \
              --key "$MACOS_NOTARY_KEY_FILE" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER" || true
            echo "::error::notarization not Accepted for CCPoolStatus.app (submission $SUBMIT_ID)"; exit 1
          fi
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          # ditto -c -k preserves the bundle metadata a plain zip would drop;
          # zip the STAPLED app so the cask payload validates offline.
          ditto -c -k --keepParent "$APP" "../dist/cc-pool-status-${GITHUB_REF_NAME}-darwin.zip"

      - name: Checksum the release assets
        run: |
          cd dist
          shasum -a 256 -- *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Export checksums for the formula and cask bumps
        id: shas
        run: |
          cd dist
          PURE="$(grep -E 'darwin-universal\.tar\.gz$' SHA256SUMS.txt | awk '{print $1}')"
          FUSE="$(grep -E 'darwin-universal-fuse\.tar\.gz$' SHA256SUMS.txt | awk '{print $1}')"
          APP="$(grep -E 'cc-pool-status-.*-darwin\.zip$' SHA256SUMS.txt | awk '{print $1}')"
          test -n "$PURE" && test -n "$FUSE" && test -n "$APP"
          echo "pure=${PURE}" >> "$GITHUB_OUTPUT"
          echo "fuse=${FUSE}" >> "$GITHUB_OUTPUT"
          echo "app=${APP}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: tarballs
          path: dist/*.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  smoke-no-fuse:
    # The fuse binary dlopens libfuse-t.dylib lazily and must run cleanly on a
    # Mac WITHOUT fuse-t. A fresh runner has none — prove it before release.
    runs-on: macos-15
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tarballs

      - name: Run the fuse binary without fuse-t installed
        run: |
          test ! -f /usr/local/lib/libfuse-t.dylib
          tar -xzf "cc-pool-${GITHUB_REF_NAME}-darwin-universal-fuse.tar.gz"
          ./cc-pool --version
          ./cc-pool --help | grep -q "emptiest account"

  bump-formula:
    runs-on: ubuntu-latest
    needs: [build, smoke-no-fuse]
    # Prerelease tags (v1.2.3-rc.1) publish assets but never touch the tap.
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      # The formula and cask live in the shared external tap yasyf/homebrew-tap,
      # not in this repo — so `brew install yasyf/tap/cc-pool` works without a
      # bespoke tap URL. Release assets still come from THIS repo's GitHub
      # Releases (the url lines below point at github.com/yasyf/cc-pool/...).
      # We render the files into a local staging dir and hand it to the shared
      # publish composite action, which checks out the tap, copies the staging
      # contents in, and commits/pushes. HOMEBREW_TAP_TOKEN must be a PAT (or
      # fine-grained token) with push access to yasyf/homebrew-tap; the default
      # GITHUB_TOKEN cannot push cross-repo.
      - name: Write the bumped Formula and Cask into the staging dir
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PURE_SHA="${{ needs.build.outputs.pure_sha256 }}"
          FUSE_SHA="${{ needs.build.outputs.fuse_sha256 }}"
          APP_SHA="${{ needs.build.outputs.app_sha256 }}"
          test -n "$PURE_SHA" && test -n "$FUSE_SHA" && test -n "$APP_SHA"

          mkdir -p tap-staging/Formula tap-staging/Casks

          # Formula: prebuilt universal binary from THIS repo's GitHub Releases,
          # with a `service` block for `brew services` (the reason cc-pool stays
          # a formula rather than a cask) and runtime fuse-t autodetection. The
          # download urls carry the /vX.Y.Z/ path segment brew reads as the
          # version; the heredoc interpolates ${VERSION} / ${*_SHA} from the
          # release just built above. Keep this in sync with the install logic
          # the project documents — only the publish LOCATION moved to the tap.
          cat > tap-staging/Formula/cc-pool.rb <<RUBY
          # Homebrew formula for cc-pool. Installs the prebuilt universal binary from
          # GitHub Releases — no Go toolchain needed. \`brew install --HEAD\` builds from
          # source instead.
          #
          #   brew install yasyf/tap/cc-pool
          #
          # Two prebuilt variants ship per release: pure-Go (symlink overlay) and
          # -tags fuse (live-mirror overlay; dlopens libfuse-t.dylib at runtime and
          # falls back to symlinks without it). Install picks the fuse build iff fuse-t
          # is present. To enable the mirror: \`brew install macos-fuse-t/cask/fuse-t\`
          # then \`brew reinstall cc-pool\`.
          #
          # This file is GENERATED by cc-pool's release.yml bump-formula job and
          # pushed here on every tagged release — do not hand-edit; change the
          # template in cc-pool's .github/workflows/release.yml instead.
          class CcPool < Formula
            desc "Predictive multi-account load-balancing for Claude Code"
            homepage "https://github.com/yasyf/cc-pool"
            url "https://github.com/yasyf/cc-pool/releases/download/v${VERSION}/cc-pool-v${VERSION}-darwin-universal.tar.gz"
            sha256 "${PURE_SHA}" # pure
            license "PolyForm-Noncommercial-1.0.0"

            livecheck do
              url :stable
              strategy :github_latest
            end

            head do
              url "https://github.com/yasyf/cc-pool.git", branch: "main"
              depends_on "go" => :build
            end

            depends_on :macos

            # fuse-t (the kext-less FUSE for the live-mirror overlay). Not a hard dep — a
            # cask can't be a formula dep — so we detect it at install time instead.
            FUSE_T_HEADER = "/usr/local/include/fuse/fuse.h".freeze
            FUSE_T_DYLIB = "/usr/local/lib/libfuse-t.dylib".freeze

            # The fuse-variant binary (cgo, -tags fuse). A resource keeps the second
            # artifact checksummed; it is only downloaded when staged below.
            resource "fuse" do
              url "https://github.com/yasyf/cc-pool/releases/download/v${VERSION}/cc-pool-v${VERSION}-darwin-universal-fuse.tar.gz"
              sha256 "${FUSE_SHA}" # fuse
            end

            def install
              if build.head?
                install_from_source
              elsif File.exist?(FUSE_T_DYLIB)
                ohai "fuse-t detected — installing the live-mirror (fuse) build"
                resource("fuse").stage { bin.install "cc-pool" }
              else
                bin.install "cc-pool"
              end
              bin.install_symlink "cc-pool" => "ccp"
            end

            # HEAD builds compile from source with the build-time fuse autodetect: cgo +
            # -tags fuse when fuse-t headers are present, pure Go otherwise.
            def install_from_source
              ldflags = %W[
                -s -w
                -X github.com/yasyf/cc-pool/internal/version.Version=#{version}
              ]
              args = std_go_args(ldflags: ldflags.join(" "), output: bin/"cc-pool")
              if File.exist?(FUSE_T_HEADER) && File.exist?(FUSE_T_DYLIB)
                ohai "fuse-t detected — building the live-mirror overlay (-tags fuse)"
                ENV["CGO_ENABLED"] = "1"
                args += ["-tags", "fuse"]
              else
                ENV["CGO_ENABLED"] = "0"
              end
              system "go", "build", *args, "./cmd/cc-pool"
            end

            # Run the daemon as a USER LaunchAgent (no sudo): it needs the user's login
            # Keychain, which a root daemon cannot read. \`brew services start cc-pool\`
            # installs ~/Library/LaunchAgents/homebrew.mxcl.cc-pool.plist.
            service do
              run [opt_bin/"cc-pool", "daemon"]
              keep_alive true
              run_at_load true
              environment_variables PATH:                 std_service_path_env,
                                    CGOFUSE_LIBFUSE_PATH: "/usr/local/lib/libfuse-t.dylib"
              log_path "#{Dir.home}/.cc-pool/daemon.log"
              error_log_path "#{Dir.home}/.cc-pool/daemon.log"
            end

            def caveats
              <<~EOS
                Get started:
                  ccp             # walks you through pooling your subscriptions
                  ccp run         # launch claude on the emptiest account

                Plain \`claude\` on ~/.claude keeps working untouched.

                Before \`brew uninstall\`, run \`ccp service uninstall\` to stop the daemon
                and mount holder and unmount pool accounts.
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/cc-pool --version")
              assert_match "emptiest account", shell_output("#{bin}/ccp --help")
            end
          end
          RUBY

          # Cask: the Notification Center widget app. cc-pool remains a formula,
          # so the dependency stays `depends_on formula: "cc-pool"`. The url
          # interpolates #{version}, so only the version line + the `# app` sha
          # change per release.
          cat > tap-staging/Casks/cc-pool-status.rb <<RUBY
          # Homebrew cask for the cc-pool Notification Center widget (CCPoolStatus.app).
          #
          # The app is Developer ID signed, notarized, and stapled, so a normal
          # quarantined install works. Install with \`ccp widget\`, or by hand:
          #
          #   brew install --cask yasyf/tap/cc-pool-status
          #
          # This file is GENERATED by cc-pool's release.yml bump-formula job and
          # pushed here on every tagged release — do not hand-edit; change the
          # template in cc-pool's .github/workflows/release.yml instead.
          cask "cc-pool-status" do
            version "${VERSION}"
            sha256 "${APP_SHA}" # app

            url "https://github.com/yasyf/cc-pool/releases/download/v#{version}/cc-pool-status-v#{version}-darwin.zip"
            name "cc-pool Status"
            desc "Notification Center widget showing cc-pool account status"
            homepage "https://github.com/yasyf/cc-pool"

            depends_on macos: :sonoma # parsed with a ">=" comparator: sonoma or newer
            depends_on formula: "cc-pool"

            app "CCPoolStatus.app"

            uninstall quit: "com.yasyf.cc-pool.status"

            zap trash: [
              "~/Library/Containers/com.yasyf.cc-pool.status.widget",
            ]

            caveats <<~EOS
              Launch the app once so macOS discovers the widget:
                open -ga CCPoolStatus
              Then: Notification Center (click the menu-bar clock) → Edit Widgets → "cc-pool".
            EOS
          end
          RUBY

          # Fail loud if the interpolation produced something unexpected; allow
          # idempotent re-runs (re-tagging the same version is a no-op push).
          grep -q "releases/download/v${VERSION}/" tap-staging/Formula/cc-pool.rb
          grep -q "${PURE_SHA}\" # pure" tap-staging/Formula/cc-pool.rb
          grep -q "${FUSE_SHA}\" # fuse" tap-staging/Formula/cc-pool.rb
          grep -q "version \"${VERSION}\"" tap-staging/Casks/cc-pool-status.rb
          grep -q "${APP_SHA}\" # app" tap-staging/Casks/cc-pool-status.rb

      # The shared composite action checks out yasyf/homebrew-tap, merges the
      # staging dir's contents into the tap root, and commits/pushes (it no-ops
      # when nothing changed — re-tagging the same version is idempotent).
      - name: Publish the bumped files to the tap
        uses: yasyf/homebrew-tap/.github/actions/publish@main
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          dir: tap-staging
          message: "cc-pool ${{ github.ref_name }}"
