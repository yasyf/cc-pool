name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: cc-pool-release
  cancel-in-progress: false

jobs:
  suite-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject Go and Swift dependency skew
        run: .github/scripts/verify-suite-pins.sh

  verify-tag-on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: yasyf/homebrew-tap/.github/actions/verify-tag-on-main@a4179241558456339fa2e41b97693a6cebae2e36

  version:
    runs-on: ubuntu-latest
    outputs:
      marketing: ${{ steps.derive.outputs.marketing }}
    steps:
      - id: derive
        shell: bash
        # release-app.yml requires bare MAJOR.MINOR.PATCH; the tag carries a v
        # prefix and, on rc tags, a prerelease suffix.
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "marketing=${v%%-*}" >> "$GITHUB_OUTPUT"

  release:
    needs: [verify-tag-on-main, release-app, suite-pins, version]
    runs-on: macos-15
    permissions:
      contents: write
    outputs:
      pure_sha256: ${{ steps.shas.outputs.pure }}
      release_id: ${{ steps.draft.outputs['release-id'] }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download the verified staged CCPoolStatus application
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release-app.outputs.artifact_name }}
          path: dist/staged-app

      - name: Require CLI signing and notarization secrets
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          require_secret() {
            [ -n "$1" ] || { echo "::error::required secret $2 is empty"; exit 1; }
          }
          require_secret "$MACOS_SIGN_P12" MACOS_SIGN_P12
          require_secret "$MACOS_SIGN_PASSWORD" MACOS_SIGN_PASSWORD
          require_secret "$MACOS_NOTARY_KEY" MACOS_NOTARY_KEY
          require_secret "$MACOS_NOTARY_KEY_ID" MACOS_NOTARY_KEY_ID
          require_secret "$MACOS_NOTARY_ISSUER_ID" MACOS_NOTARY_ISSUER_ID

      - name: Import Developer ID certificate
        uses: yasyf/homebrew-tap/.github/actions/import-developer-id@19c3d5013032ad9c88f9a8f1170d1f366c19b8d9
        with:
          p12: ${{ secrets.MACOS_SIGN_P12 }}
          p12-password: ${{ secrets.MACOS_SIGN_PASSWORD }}
          notary-key: ${{ secrets.MACOS_NOTARY_KEY }}
          notary-key-id: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          notary-issuer-id: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      - name: Build universal CLI (pure Go, arm64 + amd64 via lipo)
        env:
          # Sign the ordinary CLI/daemon under one stable dotted identifier. It
          # carries no App Group entitlement; the fixed app owns that boundary.
          MACOS_CODESIGN_IDENTIFIER: com.yasyf.cc-pool
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          LDFLAGS="-s -w -X github.com/yasyf/cc-pool/internal/version.Version=${VERSION} -X github.com/yasyf/cc-pool/internal/version.Commit=${COMMIT} -X github.com/yasyf/cc-pool/internal/version.StatusAppVersion=${{ needs.version.outputs.marketing }}"
          mkdir -p dist/pure

          # The account daemon never touches the App Group; the fixed signed
          # status app owns the FuseKit runtime and broker.
          CGO_ENABLED=0 GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/pure-arm64 ./cmd/cc-pool
          CGO_ENABLED=0 GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/pure-amd64 ./cmd/cc-pool
          lipo -create -output dist/pure/cc-pool dist/pure-arm64 dist/pure-amd64

          test -n "$MACOS_SIGN_IDENTITY"
          test -n "$TEAM_ID"
          test -f "$MACOS_NOTARY_KEY_FILE"
          bash "$MACOS_CODESIGN_SCRIPT" dist/pure/cc-pool darwin_universal
          codesign --verify --strict --verbose=2 dist/pure/cc-pool
          metadata="$(codesign -dvvv dist/pure/cc-pool 2>&1)"
          grep -q '^Identifier=com.yasyf.cc-pool$' <<< "$metadata"
          grep -q "^TeamIdentifier=${TEAM_ID}$" <<< "$metadata"
          grep -Eq '^CodeDirectory .* flags=.*\(runtime\)' <<< "$metadata"
          requirement="$(codesign -d -r- dist/pure/cc-pool 2>&1)"
          grep -Fq 'identifier "com.yasyf.cc-pool"' <<< "$requirement"
          grep -Fq "subject.OU] = ${TEAM_ID}" <<< "$requirement"
          cli_version="$(dist/pure/cc-pool --version)"
          grep -Fq "${VERSION}" <<< "$cli_version"
          CLI_ENTITLEMENTS="$(codesign -d --entitlements - dist/pure/cc-pool 2>&1 || true)"
          if grep -q "application-groups" <<<"$CLI_ENTITLEMENTS"; then
            echo "::error::cc-pool CLI binary still carries an app-group entitlement"
            exit 1
          fi
          if grep -Fq "SXKCTF23Q2.ccp" < <(strings -a dist/pure/cc-pool); then
            echo "::error::cc-pool CLI binary embeds the App Group identifier"
            exit 1
          fi
          if grep -Fq "Library/Group Containers" < <(strings -a dist/pure/cc-pool); then
            echo "::error::cc-pool CLI binary embeds a Group Container path"
            exit 1
          fi

      - name: Assemble the release tarball
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          rm -rf dist/payload
          mkdir -p dist/payload
          cp dist/pure/cc-pool dist/payload/cc-pool
          tar -czf "dist/cc-pool-${VERSION}-darwin-universal.tar.gz" \
            -C dist/payload cc-pool
          test "$(tar -tzf "dist/cc-pool-${VERSION}-darwin-universal.tar.gz")" = cc-pool

      - name: Checksum the release assets
        id: shas
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 -- *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          PURE_SHA="$(grep -E 'darwin-universal\.tar\.gz$' SHA256SUMS.txt | awk '{print $1}')"
          test -n "$PURE_SHA"
          echo "pure=${PURE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Verify the complete staged stack before drafting
        env:
          APP_ASSET: ${{ needs.release-app.outputs.asset_filename }}
          APP_ASSET_URL: ${{ needs.release-app.outputs.asset_url }}
          APP_SHA256: ${{ needs.release-app.outputs.sha256 }}
          CLI_ASSET: cc-pool-${{ github.ref_name }}-darwin-universal.tar.gz
          CLI_SHA256: ${{ steps.shas.outputs.pure }}
        run: |
          set -euo pipefail
          expected_app="cc-pool-status-${GITHUB_REF_NAME}-darwin.zip"
          [ "$APP_ASSET" = "$expected_app" ] \
            || { echo "::error::verified app filename '$APP_ASSET' != '$expected_app'"; exit 1; }
          expected_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${expected_app}"
          [ "$APP_ASSET_URL" = "$expected_url" ] \
            || { echo "::error::verified app URL does not name the exact release asset"; exit 1; }

          app_zip="dist/staged-app/$APP_ASSET"
          app_sidecar="$app_zip.sha256"
          test -f "$app_zip"
          test -f "$app_sidecar"
          read -r sidecar_sha sidecar_path < "$app_sidecar"
          [ "$sidecar_sha" = "$APP_SHA256" ]
          [ "$(basename "$sidecar_path")" = "$APP_ASSET" ]
          [ "$(shasum -a 256 "$app_zip" | awk '{print $1}')" = "$APP_SHA256" ]

          read -r cli_sidecar_sha cli_sidecar_path < dist/SHA256SUMS.txt
          [ "$cli_sidecar_sha" = "$CLI_SHA256" ]
          [ "$(basename "$cli_sidecar_path")" = "$CLI_ASSET" ]
          [ "$(wc -l < dist/SHA256SUMS.txt | tr -d ' ')" = 1 ]
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)

          rm -rf dist/verified
          mkdir -p dist/verified/cli dist/verified/app
          tar -xzf "dist/$CLI_ASSET" -C dist/verified/cli
          codesign --verify --strict --verbose=2 dist/verified/cli/cc-pool
          metadata="$(codesign -dvvv dist/verified/cli/cc-pool 2>&1)"
          grep -q '^Identifier=com.yasyf.cc-pool$' <<< "$metadata"
          grep -q '^TeamIdentifier=SXKCTF23Q2$' <<< "$metadata"
          cli_version="$(dist/verified/cli/cc-pool --version)"
          cli_help="$(dist/verified/cli/cc-pool --help)"
          grep -Fq "$GITHUB_REF_NAME" <<< "$cli_version"
          grep -Fq "emptiest account" <<< "$cli_help"

          ditto -x -k "$app_zip" dist/verified/app
          test -d dist/verified/app/CCPoolStatus.app
          APP_PATH="$PWD/dist/verified/app/CCPoolStatus.app" \
            TEAM_ID=SXKCTF23Q2 APP_GROUP=SXKCTF23Q2.ccp \
            bash "$GITHUB_WORKSPACE/scripts/assert-signed-topology.sh"
          xcrun stapler validate dist/verified/app/CCPoolStatus.app
          spctl --assess --type execute --verbose=4 dist/verified/app/CCPoolStatus.app

      - name: Record the exact release asset manifest
        env:
          APP_ASSET: ${{ needs.release-app.outputs.asset_filename }}
          CLI_ASSET: cc-pool-${{ github.ref_name }}-darwin-universal.tar.gz
        run: |
          set -euo pipefail
          printf '%s\n' \
            "dist/$CLI_ASSET" \
            dist/SHA256SUMS.txt \
            "dist/staged-app/$APP_ASSET" \
            "dist/staged-app/$APP_ASSET.sha256" \
            > "$RUNNER_TEMP/cc-pool-release-assets"

      - name: Stage and verify the complete draft release
        id: draft
        uses: yasyf/homebrew-tap/.github/actions/stage-draft-release@e4c3108e693681df1a3c666bae80e890bc44cf3e
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          manifest: ${{ runner.temp }}/cc-pool-release-assets
          title: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publish the verified release
        uses: yasyf/homebrew-tap/.github/actions/publish-draft-release@54e3e194bda69896894a82c17fcdb2822beefab5
        with:
          token: ${{ github.token }}
          release-id: ${{ steps.draft.outputs['release-id'] }}
          tag: ${{ github.ref_name }}
          manifest: ${{ runner.temp }}/cc-pool-release-assets
          prerelease: ${{ contains(github.ref_name, '-') }}
          make-latest: ${{ !contains(github.ref_name, '-') }}

  widget-test:
    needs: [suite-pins, verify-tag-on-main]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      # The widget links against the macOS 26 SDK (glass/archived-render tiles);
      # the test build must match the release build's toolchain.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - uses: yasyf/homebrew-tap/.github/actions/prepare-app-build@19c3d5013032ad9c88f9a8f1170d1f366c19b8d9
        with:
          go-version: 1.26.5
          go-cache-dependency-path: go.sum
          brew-packages: |
            xcodegen
      - name: Test widget and File Provider logic
        run: |
          set -euo pipefail
          cd widget
          # project.yml wires configFiles: Version.xcconfig; release-app.yml writes
          # a real one, so an unsigned test build only needs it to exist.
          printf 'MARKETING_VERSION = 0.0.0\nCURRENT_PROJECT_VERSION = 1\n' > Version.xcconfig
          xcodegen generate
          xcodebuild -project CCPoolStatus.xcodeproj -scheme CCPoolStatus \
            -configuration Debug -derivedDataPath build-tests build test \
            CODE_SIGNING_ALLOWED=NO

  release-app:
    needs: [version, widget-test]
    permissions:
      contents: read
    uses: yasyf/homebrew-tap/.github/workflows/release-app.yml@7cc8a6c981cbec10fcb7f19bd75b36e9ee65ea7e
    with:
      app_name: CCPoolStatus
      asset_name: cc-pool-status
      project_dir: widget
      scheme: CCPoolStatus
      bundle_id: com.yasyf.cc-pool.status
      marketing_version: ${{ needs.version.outputs.marketing }}
      appexes: |
        Contents/PlugIns/CCPoolStatusWidget.appex
        Contents/PlugIns/CCPoolFileProvider.appex
      app_groups: |
        com.yasyf.cc-pool.status=SXKCTF23Q2.ccp
        com.yasyf.cc-pool.status.fileprovider=SXKCTF23Q2.ccp
      profile_names: |
        com.yasyf.cc-pool.status=cc-pool Status Host DevID
        com.yasyf.cc-pool.status.fileprovider=cc-pool FileProvider DevID
      assert_script: .github/scripts/assert-widget-app.sh
      go_version: 1.26.5
      go_cache_dependency_path: go.sum
    secrets:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

  publish-tap:
    needs: [release, release-app]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Require the atomic tap publication secret
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$HOMEBREW_TAP_TOKEN" ] \
            || { echo "::error::required secret HOMEBREW_TAP_TOKEN is empty"; exit 1; }

      - name: Download the final published release bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_ASSET: cc-pool-${{ github.ref_name }}-darwin-universal.tar.gz
          APP_ASSET: ${{ needs.release-app.outputs.asset_filename }}
          APP_ASSET_URL: ${{ needs.release-app.outputs.asset_url }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          set -euo pipefail
          expected_app="cc-pool-status-${GITHUB_REF_NAME}-darwin.zip"
          [ "$APP_ASSET" = "$expected_app" ] \
            || { echo "::error::verified app filename '$APP_ASSET' != '$expected_app'"; exit 1; }
          expected_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${expected_app}"
          [ "$APP_ASSET_URL" = "$expected_url" ] \
            || { echo "::error::verified app URL does not name the exact release asset"; exit 1; }
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          [ "$(jq -r '.tag_name' <<< "$release")" = "$GITHUB_REF_NAME" ]
          [ "$(jq -r '.draft' <<< "$release")" = false ]
          [ "$(jq -r '.prerelease' <<< "$release")" = false ]
          assets="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100")"
          expected="$(printf '%s\n' \
            "$CLI_ASSET" SHA256SUMS.txt "$APP_ASSET" "$APP_ASSET.sha256" | LC_ALL=C sort)"
          actual="$(jq -r '.[][] | .name' <<< "$assets" | LC_ALL=C sort)"
          [ "$actual" = "$expected" ] \
            || { echo "::error::published release asset set is not exact"; exit 1; }
          mkdir -p dist/released
          while IFS=$'\t' read -r name asset_id; do
            curl --fail --silent --show-error --location \
              -H "Accept: application/octet-stream" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              --output "dist/released/$name"
          done < <(jq -r '.[][] | [.name, (.id | tostring)] | @tsv' <<< "$assets")

      - name: Verify the exact distributed CLI and application
        env:
          CLI_SHA256: ${{ needs.release.outputs.pure_sha256 }}
          APP_SHA256: ${{ needs.release-app.outputs.sha256 }}
          CLI_ASSET: cc-pool-${{ github.ref_name }}-darwin-universal.tar.gz
          APP_ASSET: ${{ needs.release-app.outputs.asset_filename }}
        run: |
          set -euo pipefail
          cd dist/released
          [ "$(wc -l < SHA256SUMS.txt | tr -d ' ')" = 1 ]
          shasum -a 256 -c SHA256SUMS.txt
          [ "$(shasum -a 256 "$CLI_ASSET" | awk '{print $1}')" = "$CLI_SHA256" ]
          read -r sidecar_sha sidecar_path < "$APP_ASSET.sha256"
          [ "$sidecar_sha" = "$APP_SHA256" ]
          [ "$(basename "$sidecar_path")" = "$APP_ASSET" ]
          [ "$(shasum -a 256 "$APP_ASSET" | awk '{print $1}')" = "$APP_SHA256" ]

          mkdir cli app
          tar -xzf "$CLI_ASSET" -C cli
          codesign --verify --strict --verbose=2 cli/cc-pool
          metadata="$(codesign -dvvv cli/cc-pool 2>&1)"
          grep -q '^Identifier=com.yasyf.cc-pool$' <<< "$metadata"
          grep -q '^TeamIdentifier=SXKCTF23Q2$' <<< "$metadata"

          ditto -x -k "$APP_ASSET" app
          test -d app/CCPoolStatus.app
          APP_PATH="$PWD/app/CCPoolStatus.app" TEAM_ID=SXKCTF23Q2 APP_GROUP=SXKCTF23Q2.ccp \
            bash "$GITHUB_WORKSPACE/scripts/assert-signed-topology.sh"
          xcrun stapler validate app/CCPoolStatus.app
          spctl --assess --type execute --verbose=4 app/CCPoolStatus.app

      - name: Render the formula into the atomic tap transaction
        id: formula
        uses: yasyf/homebrew-tap/.github/actions/render-formula@19c3d5013032ad9c88f9a8f1170d1f366c19b8d9
        with:
          template: .github/formula/cc-pool.rb.tmpl
          output: Formula/cc-pool.rb
          substitutions: |
            __SHA_PURE__=${{ needs.release.outputs.pure_sha256 }}
            __SHA_APP__=${{ needs.release-app.outputs.sha256 }}

      - name: Audit and install the exact rendered formula
        env:
          FORMULA: ${{ steps.formula.outputs.file }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bash "$GITHUB_WORKSPACE/.github/scripts/assert-formula-service.sh" "$FORMULA" "$version"
          ruby -c "$FORMULA"
          audit_tap=cc-pool/release-audit
          HOMEBREW_NO_AUTO_UPDATE=1 brew tap-new --no-git "$audit_tap"
          audit_formula="$(brew --repository "$audit_tap")/Formula/cc-pool.rb"
          cp "$FORMULA" "$audit_formula"
          cmp -s "$FORMULA" "$audit_formula"
          brew audit --strict --formula "$audit_tap/cc-pool"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install --formula "$audit_tap/cc-pool"
          prefix="$(brew --prefix "$audit_tap/cc-pool")"
          test -x "$prefix/bin/ccp"
          test -d "$prefix/libexec/CCPoolStatus.app"
          version="$("$prefix/bin/ccp" --version)"
          grep -Fq "$GITHUB_REF_NAME" <<< "$version"
          brew test "$audit_tap/cc-pool"

          target="$HOME/Applications"/CCPoolStatus.app
          test ! -e "$target"
          cleanup() {
            if [ -e "$target" ]; then
              "$prefix/bin/ccp" package uninstall || true
            fi
          }
          trap cleanup EXIT
          install_output="$("$prefix/bin/ccp" package install)"
          test "$install_output" = "installed: CCPoolStatus package"
          test -d "$target"
          codesign --verify --deep --strict --verbose=2 "$target"
          xcrun stapler validate "$target"
          spctl --assess --type execute --verbose=4 "$target"
          uninstall_output="$("$prefix/bin/ccp" package uninstall)"
          test "$uninstall_output" = "uninstalled: CCPoolStatus package"
          test ! -e "$target"
          trap - EXIT

      - name: Publish the CLI formula to the tap
        uses: yasyf/homebrew-tap/.github/actions/publish@9525763796fce4d1042cf3393d9479f791908eaa
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          dir: tap-staging
          message: "cc-pool stack ${{ github.ref_name }}"
