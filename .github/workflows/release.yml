name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-tag-on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: yasyf/homebrew-tap/.github/actions/verify-tag-on-main@f45550932b0c8a42eb04e9ab0e5de8f82ad78b6a

  version:
    runs-on: ubuntu-latest
    outputs:
      marketing: ${{ steps.derive.outputs.marketing }}
    steps:
      - id: derive
        shell: bash
        # release-app.yml requires bare MAJOR.MINOR.PATCH; the tag carries a v
        # prefix and, on rc tags, a prerelease suffix.
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "marketing=${v%%-*}" >> "$GITHUB_OUTPUT"

  release:
    needs: verify-tag-on-main
    runs-on: macos-15
    outputs:
      pure_sha256: ${{ steps.shas.outputs.pure }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Require CLI signing and notarization secrets
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          require_secret() {
            [ -n "$1" ] || { echo "::error::required secret $2 is empty"; exit 1; }
          }
          require_secret "$MACOS_SIGN_P12" MACOS_SIGN_P12
          require_secret "$MACOS_SIGN_PASSWORD" MACOS_SIGN_PASSWORD
          require_secret "$MACOS_NOTARY_KEY" MACOS_NOTARY_KEY
          require_secret "$MACOS_NOTARY_KEY_ID" MACOS_NOTARY_KEY_ID
          require_secret "$MACOS_NOTARY_ISSUER_ID" MACOS_NOTARY_ISSUER_ID

      - name: Import Developer ID certificate
        uses: yasyf/homebrew-tap/.github/actions/import-developer-id@f45550932b0c8a42eb04e9ab0e5de8f82ad78b6a
        with:
          p12: ${{ secrets.MACOS_SIGN_P12 }}
          p12-password: ${{ secrets.MACOS_SIGN_PASSWORD }}
          notary-key: ${{ secrets.MACOS_NOTARY_KEY }}
          notary-key-id: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          notary-issuer-id: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      - name: Build universal CLI (pure Go, arm64 + amd64 via lipo)
        env:
          # Sign the ordinary CLI/daemon under one stable dotted identifier. It
          # carries no App Group entitlement; the fixed app owns that boundary.
          MACOS_CODESIGN_IDENTIFIER: com.yasyf.cc-pool
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          LDFLAGS="-s -w -X github.com/yasyf/cc-pool/internal/version.Version=${VERSION} -X github.com/yasyf/cc-pool/internal/version.Commit=${COMMIT}"
          mkdir -p dist/pure

          # The account daemon never touches the App Group; the fixed signed
          # status app owns the FuseKit holder and broker.
          CGO_ENABLED=0 GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/pure-arm64 ./cmd/cc-pool
          CGO_ENABLED=0 GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/pure-amd64 ./cmd/cc-pool
          lipo -create -output dist/pure/cc-pool dist/pure-arm64 dist/pure-amd64

          test -n "$MACOS_SIGN_IDENTITY"
          test -n "$TEAM_ID"
          test -f "$MACOS_NOTARY_KEY_FILE"
          bash "$MACOS_CODESIGN_SCRIPT" dist/pure/cc-pool darwin_universal
          codesign --verify --strict --verbose=2 dist/pure/cc-pool
          metadata="$(codesign -dvvv dist/pure/cc-pool 2>&1)"
          grep -q '^Identifier=com.yasyf.cc-pool$' <<< "$metadata"
          grep -q "^TeamIdentifier=${TEAM_ID}$" <<< "$metadata"
          grep -Eq '^CodeDirectory .* flags=.*\(runtime\)' <<< "$metadata"
          requirement="$(codesign -d -r- dist/pure/cc-pool 2>&1)"
          grep -Fq 'identifier "com.yasyf.cc-pool"' <<< "$requirement"
          grep -Fq "subject.OU] = ${TEAM_ID}" <<< "$requirement"
          dist/pure/cc-pool --version | grep -q "${VERSION}"
          CLI_ENTITLEMENTS="$(codesign -d --entitlements - dist/pure/cc-pool 2>&1 || true)"
          if grep -q "application-groups" <<<"$CLI_ENTITLEMENTS"; then
            echo "::error::cc-pool CLI binary still carries an app-group entitlement"
            exit 1
          fi
          if grep -Fq "SXKCTF23Q2.ccp" < <(strings -a dist/pure/cc-pool); then
            echo "::error::cc-pool CLI binary embeds the App Group identifier"
            exit 1
          fi
          if grep -Fq "Library/Group Containers" < <(strings -a dist/pure/cc-pool); then
            echo "::error::cc-pool CLI binary embeds a Group Container path"
            exit 1
          fi

      - name: Assemble the release tarball
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          rm -rf dist/payload
          mkdir -p dist/payload
          cp dist/pure/cc-pool dist/payload/cc-pool
          tar -czf "dist/cc-pool-${VERSION}-darwin-universal.tar.gz" \
            -C dist/payload cc-pool
          test "$(tar -tzf "dist/cc-pool-${VERSION}-darwin-universal.tar.gz")" = cc-pool

      - name: Checksum the release assets
        id: shas
        run: |
          cd dist
          shasum -a 256 -- *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          PURE_SHA="$(grep -E 'darwin-universal\.tar\.gz$' SHA256SUMS.txt | awk '{print $1}')"
          test -n "$PURE_SHA"
          echo "pure=${PURE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  widget-test:
    needs: verify-tag-on-main
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      # The widget links against the macOS 26 SDK (glass/archived-render tiles);
      # the test build must match the release build's toolchain.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - uses: yasyf/homebrew-tap/.github/actions/prepare-app-build@fb4f471718f99cbfd627192e8c3f76c620e24be4
        with:
          go-version: 1.26.5
          go-cache-dependency-path: go.sum
          brew-packages: |
            xcodegen
            macos-fuse-t/cask/fuse-t
      - name: Test widget and File Provider logic
        run: |
          set -euo pipefail
          cd widget
          # project.yml wires configFiles: Version.xcconfig; release-app.yml writes
          # a real one, so an unsigned test build only needs it to exist.
          printf 'MARKETING_VERSION = 0.0.0\nCURRENT_PROJECT_VERSION = 1\n' > Version.xcconfig
          xcodegen generate
          xcodebuild -project CCPoolStatus.xcodeproj -scheme CCPoolStatus \
            -configuration Debug -derivedDataPath build-tests build test \
            CODE_SIGNING_ALLOWED=NO

  release-app:
    needs: [version, widget-test, release]
    permissions:
      contents: write
    uses: yasyf/homebrew-tap/.github/workflows/release-app.yml@f45550932b0c8a42eb04e9ab0e5de8f82ad78b6a
    with:
      app_name: CCPoolStatus
      asset_name: cc-pool-status
      project_dir: widget
      scheme: CCPoolStatus
      bundle_id: com.yasyf.cc-pool.status
      marketing_version: ${{ needs.version.outputs.marketing }}
      appexes: |
        Contents/PlugIns/CCPoolStatusWidget.appex
        Contents/PlugIns/CCPoolFileProvider.appex
      app_groups: |
        com.yasyf.cc-pool.status=SXKCTF23Q2.ccp
        com.yasyf.cc-pool.status.fileprovider=SXKCTF23Q2.ccp
      profile_names: |
        com.yasyf.cc-pool.status=cc-pool Status Host DevID
        com.yasyf.cc-pool.status.fileprovider=cc-pool FileProvider DevID
      assert_script: .github/scripts/assert-widget-app.sh
      go_version: 1.26.5
      go_cache_dependency_path: go.sum
      prebuild_brew_packages: macos-fuse-t/cask/fuse-t
    secrets:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

  publish-tap:
    needs: [release, release-app]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Require the atomic tap publication secret
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$HOMEBREW_TAP_TOKEN" ] \
            || { echo "::error::required secret HOMEBREW_TAP_TOKEN is empty"; exit 1; }

      - name: Download the final published release bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_ASSET: cc-pool-${{ github.ref_name }}-darwin-universal.tar.gz
          APP_ASSET: ${{ needs.release-app.outputs.asset_filename }}
          APP_ASSET_URL: ${{ needs.release-app.outputs.asset_url }}
        run: |
          set -euo pipefail
          expected_app="cc-pool-status-${GITHUB_REF_NAME}-darwin.zip"
          [ "$APP_ASSET" = "$expected_app" ] \
            || { echo "::error::verified app filename '$APP_ASSET' != '$expected_app'"; exit 1; }
          expected_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${expected_app}"
          [ "$APP_ASSET_URL" = "$expected_url" ] \
            || { echo "::error::verified app URL does not name the exact release asset"; exit 1; }
          mkdir -p dist/released
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir dist/released --pattern "$CLI_ASSET"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir dist/released --pattern "$APP_ASSET" --pattern "$APP_ASSET.sha256"

      - name: Verify the exact distributed CLI and application
        env:
          CLI_SHA256: ${{ needs.release.outputs.pure_sha256 }}
          APP_SHA256: ${{ needs.release-app.outputs.sha256 }}
          CLI_ASSET: cc-pool-${{ github.ref_name }}-darwin-universal.tar.gz
          APP_ASSET: ${{ needs.release-app.outputs.asset_filename }}
        run: |
          set -euo pipefail
          cd dist/released
          [ "$(shasum -a 256 "$CLI_ASSET" | awk '{print $1}')" = "$CLI_SHA256" ]
          read -r sidecar_sha sidecar_path < "$APP_ASSET.sha256"
          [ "$sidecar_sha" = "$APP_SHA256" ]
          [ "$(basename "$sidecar_path")" = "$APP_ASSET" ]
          [ "$(shasum -a 256 "$APP_ASSET" | awk '{print $1}')" = "$APP_SHA256" ]

          mkdir cli app
          tar -xzf "$CLI_ASSET" -C cli
          codesign --verify --strict --verbose=2 cli/cc-pool
          metadata="$(codesign -dvvv cli/cc-pool 2>&1)"
          grep -q '^Identifier=com.yasyf.cc-pool$' <<< "$metadata"
          grep -q '^TeamIdentifier=SXKCTF23Q2$' <<< "$metadata"

          ditto -x -k "$APP_ASSET" app
          test -d app/CCPoolStatus.app
          APP_PATH="$PWD/app/CCPoolStatus.app" TEAM_ID=SXKCTF23Q2 APP_GROUP=SXKCTF23Q2.ccp \
            bash "$GITHUB_WORKSPACE/scripts/assert-signed-topology.sh"
          xcrun stapler validate app/CCPoolStatus.app
          spctl --assess --type execute --verbose=4 app/CCPoolStatus.app

      - name: Require the full-application cask contract
        run: |
          set -euo pipefail
          template=.github/cask/cc-pool-status.rb.tmpl
          grep -Eq '^[[:space:]]*app[[:space:]]+' "$template"
          ! grep -Eq '^[[:space:]]*binary[[:space:]]+' "$template"

      - name: Render the formula into the atomic tap transaction
        uses: yasyf/homebrew-tap/.github/actions/render-formula@f45550932b0c8a42eb04e9ab0e5de8f82ad78b6a
        with:
          template: .github/formula/cc-pool.rb.tmpl
          output: Formula/cc-pool.rb
          substitutions: |
            __SHA_PURE__=${{ needs.release.outputs.pure_sha256 }}

      - name: Render the cask into the atomic tap transaction
        uses: yasyf/homebrew-tap/.github/actions/render-formula@f45550932b0c8a42eb04e9ab0e5de8f82ad78b6a
        with:
          template: .github/cask/cc-pool-status.rb.tmpl
          output: Casks/cc-pool-status.rb
          substitutions: |
            __SHA_APP__=${{ needs.release-app.outputs.sha256 }}
            __ASSET_URL__=${{ needs.release-app.outputs.asset_url }}
            __APP_NAME__=CCPoolStatus
            __CASK_TOKEN__=cc-pool-status
            __REPO__=${{ github.repository }}

      - name: Publish formula and cask in one tap commit
        uses: yasyf/homebrew-tap/.github/actions/publish@f45550932b0c8a42eb04e9ab0e5de8f82ad78b6a
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          dir: tap-staging
          message: "cc-pool stack ${{ github.ref_name }}"
