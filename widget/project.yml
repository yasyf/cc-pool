# XcodeGen spec for the cc-pool Notification Center widget.
# `xcodegen generate` emits CCPoolStatus.xcodeproj plus the Info.plists and
# entitlements under Generated/ — all gitignored; this file is the source of truth.
#
# The one fixed signed host embeds both extensions and owns the FuseKit broker.
name: CCPoolStatus
options:
  bundleIdPrefix: com.yasyf.cc-pool
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  FuseKit:
    url: https://github.com/yasyf/fusekit.git
    exactVersion: 1.15.1
  DaemonKit:
    url: https://github.com/yasyf/daemonkit.git
    exactVersion: 0.19.1

# release-app.yml writes a per-build Version.xcconfig before `xcodegen generate`;
# keep MARKETING_VERSION/CURRENT_PROJECT_VERSION out of `settings:` so it wins.
configFiles:
  Debug: Version.xcconfig
  Release: Version.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    PRODUCT_NAME: $(TARGET_NAME)

targetTemplates:
  HostApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Sources/FileProviderRuntime
    info:
      properties:
        CFBundleDisplayName: cc-pool Status
        # XcodeGen writes literal values into the generated plist; without these
        # $(…) references the MARKETING_VERSION/CURRENT_PROJECT_VERSION build
        # settings (and any command-line overrides) never reach the bundle — and
        # chronod caches widget metadata keyed by bundle version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true # agent app: no Dock icon, no menu bar
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yasyf.cc-pool.status
        SWIFT_OBJC_BRIDGING_HEADER: Sources/HolderBridge/CCPoolFuseKitBridge.h
        OTHER_LDFLAGS:
          - $(inherited)
          - $(DERIVED_FILE_DIR)/libCCPoolFuseKit.a
        # Sources/App/Assets.xcassets is auto-included by the Sources/App source
        # path; this names its appiconset as the app icon the widget gallery shows.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Build embedded FuseKit runtime
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          arm64_archive="$DERIVED_FILE_DIR/libCCPoolFuseKit-arm64.a"
          x86_archive="$DERIVED_FILE_DIR/libCCPoolFuseKit-x86_64.a"
          archive="$DERIVED_FILE_DIR/libCCPoolFuseKit.a"
          cd "$SRCROOT/.."
          holder_version="v$MARKETING_VERSION"
          case "${GITHUB_REF_NAME:-}" in
            v[0-9]*) holder_version="$GITHUB_REF_NAME" ;;
          esac
          holder_commit="$(git rev-parse --short HEAD)"
          holder_ldflags="-X github.com/yasyf/cc-pool/internal/version.Version=$holder_version -X github.com/yasyf/cc-pool/internal/version.Commit=$holder_commit"
          export CGO_CFLAGS="-mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET"
          export CGO_LDFLAGS="-mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET"
          GOWORK=off CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -buildmode=c-archive -ldflags "$holder_ldflags" \
            -o "$arm64_archive" ./cmd/cc-pool-runtime-archive
          GOWORK=off CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            go build -buildmode=c-archive -ldflags "$holder_ldflags" \
            -o "$x86_archive" ./cmd/cc-pool-runtime-archive
          lipo -create "$arm64_archive" "$x86_archive" -output "$archive"
    dependencies:
      - target: CCPoolStatusWidget
        embed: true
        codeSign: true
      - package: FuseKit
      - package: DaemonKit

targets:
  CCPoolStatus:
    templates: [HostApp]
    info:
      path: Generated/App-Info.plist
    entitlements:
      path: Generated/App.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)ccp
    settings:
      base:
        PROVISIONING_PROFILE_SPECIFIER: "cc-pool Status Host DevID"
    dependencies:
      - target: CCPoolFileProvider
        embed: true
        codeSign: true

  CCPoolStatusWidget:
    # NSExtension-style WidgetKit appex (PlugIns/), the best-trodden
    # XcodeGen path. If gallery discovery ever breaks, the ExtensionKit
    # conversion is mechanical: type extensionkit-extension + replace the
    # NSExtension dict with EXAppExtensionAttributes/EXExtensionPointIdentifier.
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: cc-pool Status
        # Same $(…) wiring as the host app — the appex must carry the stamped
        # version too; it is the bundle chronod actually inspects.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      # macOS requires app extensions to be sandboxed; the temporary exception
      # grants read-only access to ~/.cc-pool/ (status.json). Sandbox exceptions
      # are not provisioning-restricted, so this works with local signing.
      path: Generated/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /.cc-pool/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yasyf.cc-pool.status.widget
        SKIP_INSTALL: true

  CCPoolFileProvider:
    # NSFileProviderReplicatedExtension appex (PlugIns/), embedded only by the
    # fixed CCPoolStatus host. The plist and Swift runtime pin the same exact
    # App Group; release assertions reject any divergence.
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/FileProvider
      - path: Sources/FileProviderRuntime
    info:
      path: Generated/FileProvider-Info.plist
      properties:
        CFBundleDisplayName: cc-pool Status
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: CCPoolFileProvider.FileProviderExtension
          NSExtensionFileProviderDocumentGroup: $(TeamIdentifierPrefix)ccp
          NSExtensionFileProviderSupportsEnumeration: true
    entitlements:
      # Sandboxed as required. The extension reaches only the App Group broker;
      # it never traverses ~/.claude or ~/.cc-pool directly.
      path: Generated/FileProvider.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)ccp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yasyf.cc-pool.status.fileprovider
        SKIP_INSTALL: true
        # Embedded Developer ID profile authorizing this appex's App Group claim —
        # the no-prompt grant for the File Provider group container (same reason as
        # the host app). The Notification Center widget appex carries no profile: it
        # has no App Group and no restricted entitlements.
        PROVISIONING_PROFILE_SPECIFIER: "cc-pool FileProvider DevID"
    dependencies:
      - package: FuseKit
      - package: DaemonKit

  CCPoolStatusTests:
    # Host-less unit-test bundle for PURE logic only. It compiles the code
    # under test straight into the bundle — no TEST_HOST, no app launch, no
    # signed appex — so it runs standalone in CI. Keep it pure: anything
    # needing AppKit or a live NSFileProviderManager belongs in the VM e2e,
    # not here (FileProvider TYPES are fine — nothing talks to fileproviderd).
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/App/Countdown.swift
      - path: Sources/FileProviderRuntime
      - path: Sources/Shared/Status.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yasyf.cc-pool.status.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - package: FuseKit
      - package: DaemonKit

schemes:
  CCPoolStatus:
    build:
      targets:
        CCPoolStatus: all
        CCPoolStatusTests: [test]
    test:
      config: Debug
      targets:
        - CCPoolStatusTests
    run:
      config: Debug
    archive:
      config: Release
