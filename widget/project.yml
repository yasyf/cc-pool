# XcodeGen spec for the cc-pool Notification Center widget.
# `xcodegen generate` emits CCPoolStatus.xcodeproj plus the Info.plists and
# entitlements under Generated/ — all gitignored; this file is the source of truth.
#
# Signing: ad-hoc by default (runs locally, no Apple ID). If chronod refuses to
# load the ad-hoc-signed widget, switch to a free personal team:
#   xcodebuild ... CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM=<TEAMID> -allowProvisioningUpdates
#
# Two host-app flavors share the HostApp template: CCPoolStatus (ad-hoc, widget
# appex only — the unchanged local build) and CCPoolStatusFP (adds the File
# Provider appex + App Group entitlements; identity/team come from the
# xcodebuild command line: CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=SXKCTF23Q2).
name: CCPoolStatus
options:
  bundleIdPrefix: com.yasyf.cc-pool
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    PRODUCT_NAME: $(TARGET_NAME)
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targetTemplates:
  HostApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    info:
      properties:
        CFBundleDisplayName: cc-pool Status
        # XcodeGen writes literal values into the generated plist; without these
        # $(…) references the MARKETING_VERSION/CURRENT_PROJECT_VERSION build
        # settings (and any command-line overrides) never reach the bundle — and
        # chronod caches widget metadata keyed by bundle version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true # agent app: no Dock icon, no menu bar
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yasyf.cc-pool.status
        # Sources/App/Assets.xcassets is auto-included by the Sources/App source
        # path; this names its appiconset as the app icon the widget gallery shows.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: CCPoolStatusWidget
        embed: true
        codeSign: true

targets:
  CCPoolStatus:
    templates: [HostApp]
    info:
      path: Generated/App-Info.plist
    # The host app is deliberately NOT sandboxed (non-App-Store). No
    # entitlements file.

  CCPoolStatusFP:
    # File-Provider-enabled host flavor: same bundle id, and PRODUCT_NAME pins
    # the built product to CCPoolStatus.app (/Applications/CCPoolStatus.app is
    # a fixed identifier in the Go code). Stays non-sandboxed — the App Group
    # is its ONLY entitlement.
    templates: [HostApp]
    info:
      path: Generated/AppFP-Info.plist
    entitlements:
      path: Generated/AppFP.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)ccp
    settings:
      base:
        PRODUCT_NAME: CCPoolStatus
    dependencies:
      - target: CCPoolFileProvider
        embed: true
        codeSign: true

  CCPoolStatusWidget:
    # Legacy NSExtension-style WidgetKit appex (PlugIns/), the best-trodden
    # XcodeGen path. If gallery discovery ever breaks, the ExtensionKit
    # conversion is mechanical: type extensionkit-extension + replace the
    # NSExtension dict with EXAppExtensionAttributes/EXExtensionPointIdentifier.
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: cc-pool Status
        # Same $(…) wiring as the host app — the appex must carry the stamped
        # version too; it is the bundle chronod actually inspects.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      # macOS requires app extensions to be sandboxed; the temporary exception
      # grants read-only access to ~/.cc-pool/ (status.json). Sandbox exceptions
      # are not provisioning-restricted, so this works with local signing.
      path: Generated/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /.cc-pool/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yasyf.cc-pool.status.widget
        SKIP_INSTALL: true

  CCPoolFileProvider:
    # NSFileProviderReplicatedExtension appex (PlugIns/), embedded only by the
    # CCPoolStatusFP flavor. Reads the App Group at runtime from
    # NSExtensionFileProviderDocumentGroup — never hardcoded in Swift.
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/FileProvider
      - path: Sources/Shared
    info:
      path: Generated/FileProvider-Info.plist
      properties:
        CFBundleDisplayName: cc-pool Status
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: CCPoolFileProvider.FileProviderExtension
          NSExtensionFileProviderDocumentGroup: $(TeamIdentifierPrefix)ccp
          NSExtensionFileProviderSupportsEnumeration: true
    entitlements:
      # Sandboxed (required for appexes); the read-write exception resolves
      # against the REAL home (paired with getpwuid in Swift). NO
      # fileprovider.testing-mode — restricted, would force a provisioning
      # profile and break the no-profile Developer ID release.
      path: Generated/FileProvider.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)ccp
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /.claude/
          - /.claude.json
          - /.cc-pool/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yasyf.cc-pool.status.fileprovider
        SKIP_INSTALL: true

  CCPoolStatusTests:
    # Host-less unit-test bundle for PURE logic only. It compiles the code
    # under test straight into the bundle — no TEST_HOST, no app launch, no
    # signed appex — so it runs standalone in CI. Keep it pure: anything
    # needing AppKit or a live NSFileProviderManager belongs in the VM e2e,
    # not here (FileProvider TYPES are fine — nothing talks to fileproviderd).
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/App/Countdown.swift
      - path: Sources/App/DomainClaims.swift
      - path: Sources/App/FileProviderControlPolicy.swift
      - path: Sources/App/FileProviderDomainPolicy.swift
      - path: Sources/FileProvider/BackingMutationIO.swift
      - path: Sources/FileProvider/SynthCache.swift
      - path: Sources/FileProvider/FileProviderEnumerationPolicy.swift
      - path: Sources/FileProvider/ItemID.swift
      - path: Sources/FileProvider/MutationPolicy.swift
      - path: Sources/FileProvider/FPItem.swift
      - path: Sources/FileProvider/Enumerators.swift
      - path: Sources/Shared/Status.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yasyf.cc-pool.status.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"

schemes:
  CCPoolStatus:
    build:
      targets:
        CCPoolStatus: all
        CCPoolStatusTests: [test]
    test:
      config: Debug
      targets:
        - CCPoolStatusTests
    run:
      config: Debug
    archive:
      config: Release

  CCPoolStatusFP:
    build:
      targets:
        CCPoolStatusFP: all
    run:
      config: Debug
    archive:
      config: Release
